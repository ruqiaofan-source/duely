name: PR checks

# Runs on every pull request into main. This is the safety net between an AI
# agent's change and real users: it catches the two mistakes that actually take
# the site down or break people's sessions.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every JS file
        run: |
          set -e
          for f in server.js cards.js public/app.js public/i18n.js public/sounds.js; do
            printf '  %-22s' "$f"
            node --check "$f"
            echo 'OK'
          done
          echo "Syntax OK — the site will at least boot."

      - name: Cache-bust reminder
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          NEEDS_BUST=$(echo "$CHANGED" | grep -E '^public/(app|i18n|sounds)\.js$|^public/styles\.css$' || true)
          if [ -n "$NEEDS_BUST" ]; then
            if echo "$CHANGED" | grep -q '^public/index\.html$'; then
              echo "Cache-bust: index.html was updated alongside the asset change. Good."
            else
              echo "::error::You changed $(echo $NEEDS_BUST | tr '\n' ' ')but not public/index.html."
              echo "Browsers cache those files, so users would keep running the OLD version."
              echo "Fix: open public/index.html, find the line for that file near the bottom"
              echo "(it looks like  <script src=\"/app.js?v=23\"></script>  ) and add 1 to the number."
              exit 1
            fi
          else
            echo "No cached front-end assets changed — nothing to bump."
          fi

      - name: Protected identifiers must survive
        run: |
          fail=0
          check() {
            if grep -q "$2" "$1"; then
              echo "  OK    $2 still in $1"
            else
              echo "::error::$2 has gone from $1. Renaming it logs EVERY existing user out permanently, with no way back. See AGENTS.md section 1."
              fail=1
            fi
          }
          check public/app.js settle_me
          check public/app.js x-duely-secret
          check server.js    x-duely-secret
          [ "$fail" = 0 ] || exit 1

      - name: No banned words in added lines
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then echo "Not a pull request, nothing to diff."; exit 0; fi
          ADDED=$(git diff "$BASE"...HEAD -- . ':(exclude)AGENTS.md' ':(exclude).github/workflows' \
                  | grep '^+' | grep -v '^+++' || true)
          # Only words with ZERO legitimate use anywhere in this repo, so this can
          # never fail on pre-existing copy. The ambiguous ones (odds, stake,
          # betting, zaklad, bukmacher) already appear on purpose in the legal
          # explainer pages and the Polish UI, so they are not gated here.
          PAT='acca|accumulator|tipster|winnings|cash out|jackpot|kursy'
          HITS=$(echo "$ADDED" | grep -Ein "$PAT" || true)
          if [ -n "$HITS" ]; then
            echo "::error::A banned word appears in the lines this PR adds. These are what gambling classifiers key on, and Poland can block a domain in 48h before an appeal is read. See AGENTS.md section 2."
            echo "$HITS"
            exit 1
          fi
          echo "No banned words in added lines."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the test suite
        run: npm test

      - name: What these checks still cannot see
        if: always()
        run: |
          echo "Filip's PRs auto-merge when this goes green. Nothing human reads them."
          echo "Still NOT covered by any automated check:"
          echo "  1. Whether the copy is good, or in the right tone."
          echo "  2. Whether the layout survives at 390px wide."
          echo "  3. Whether new English text got a Polish line in public/i18n.js."
          echo "  4. Ambiguous legal words (odds, stake, betting) used in NEW user-facing copy."
          echo "     Those exist deliberately in the legal explainer pages, so they are not gated."
          echo "  See AGENTS.md. Spot-check merged PRs now and then."

# (harmless line added to test that the auto-merge gate refuses workflow changes)
